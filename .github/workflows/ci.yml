name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Test
        run: pytest -q

  quality:
    name: Lint, types and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy
        run: mypy src/ tests/

      - name: Coverage
        run: pytest --cov --cov-report=term --cov-report=xml -q

      - name: Enforce the coverage floor
        run: coverage report --fail-under=90

  protocol:
    name: Protocol conformance over a real pipe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install .

      # Drives the installed binary as a subprocess over actual stdin/stdout, which is how a client
      # launches it. The unit tests use StringIO, so this is the only place the real stream
      # plumbing is exercised -- including the rule that nothing but MCP may reach stdout.
      - name: Conformance checks
        run: python scripts/conformance.py
