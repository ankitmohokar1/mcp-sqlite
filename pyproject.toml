[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sqlite-explorer"
version = "1.0.0"
description = "A read-only SQLite explorer exposed to AI assistants over the Model Context Protocol."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ankit Mohokar" }]
keywords = ["mcp", "model-context-protocol", "sqlite", "llm", "claude", "ai-tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Database",
  "Typing :: Typed",
]

# No runtime dependencies. MCP is JSON-RPC over stdin/stdout and SQLite ships with Python,
# so the whole server is standard library -- which matters for something a user is asked to
# launch as a subprocess on their own machine with access to their data.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.5",
]

[project.scripts]
mcp-sqlite = "mcp_sqlite.__main__:main"

[project.urls]
Homepage = "https://github.com/ankitmohokar1/mcp-sqlite"
Issues = "https://github.com/ankitmohokar1/mcp-sqlite/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_sqlite = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.coverage.run]
branch = true
source = ["mcp_sqlite"]
